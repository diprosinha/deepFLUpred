[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepflupred"
version = "0.1.0"
description = "A deep learning-based framework for genomic characterization, subtyping, and pathogenicity prediction of avian influenza viruses"
readme = "README.md"
authors = [
  { name = "Dipro Sinha" },
  { name = "Naveen Duhan" },
  { name = "Jagathiswaran Radhakrisnan" },
  { name = "Sunil Mor" },
]
keywords = [
  "avian influenza",
  "bioinformatics",
  "HA subtype",
  "NA subtype",
  "HPAI",
  "LPAI",
  "machine learning",
  "viral genomics",
]
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.5",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
deepflupred = "deepflupred.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deepflupred"]

[tool.hatch.build.targets.sdist]
include = [
  "src/deepflupred",
  "tests",
  "build_resources.py",
  "README.md",
  "pyproject.toml",
  "CITATION.cff",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
